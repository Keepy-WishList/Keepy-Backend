spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
          lob:
            non_contextual_creation: true

  sql:
    init:
      mode: never

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
            redirect-uri: "${SERVER_DOMAIN}/login/oauth2/code/google"
          apple:
            client-id: ${APPLE_CLIENT_ID}
            client-secret: ${APPLE_CLIENT_SECRET}
            client-authentication-method: private_key_jwt
            authorization-grant-type: authorization_code
            redirect-uri: "${SERVER_DOMAIN}/login/oauth2/code/apple"
            scope: email, name
            provider: apple
        provider:
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  key: ${JWT_SECRET}
  access-token-validity-in-seconds: 1800000
  refresh-token-validity-in-seconds: 604800000

openai:
  api-key: ${MINDLOGIC_API_KEY}
  api-url: https://factchat-cloud.mindlogic.ai/v1/api/anthropic/messages
  model: claude-sonnet-4-5-20250929

gcp:
  project-id: ${GCP_PROJECT_ID}
  sa-key-json: ${GCP_SA_KEY_JSON}
  storage:
    bucket: ${GCS_BUCKET_NAME}

app:
  cookie:
    secure: true

frontend:
  url: ${FRONTEND_URL}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  file:
    path: /keepy/logs
