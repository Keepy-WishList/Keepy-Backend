name: CD

on:
  push:
    branches: [ main ]

env:
  GAR_LOCATION: ${{ secrets.GCP_REGION }}
  IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPOSITORY }}/keepy-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Lowercase image name
        run: echo "IMAGE=${IMAGE,,}" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            mkdir -p ~/keepy

            cat > ~/keepy/docker-compose.yml << 'COMPOSEEOF'
            services:
              mysql:
                container_name: keepy-mysql
                image: mysql:8.0
                environment:
                  MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
                  MYSQL_DATABASE: keepy
                  MYSQL_USER: ${MYSQL_USERNAME}
                  MYSQL_PASSWORD: ${MYSQL_PASSWORD}
                volumes:
                  - mysql_data:/var/lib/mysql
                healthcheck:
                  test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              app:
                container_name: keepy
                image: asia-northeast3-docker.pkg.dev/keepy-493212/keepy/keepy-backend:latest
                ports:
                  - "8080:8080"
                environment:
                  SPRING_PROFILES_ACTIVE: prod
                  MYSQL_URL: jdbc:mysql://mysql:3306/keepy?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
                  MYSQL_USERNAME: ${MYSQL_USERNAME}
                  MYSQL_PASSWORD: ${MYSQL_PASSWORD}
                  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
                  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
                  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
                  APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET}
                  JWT_SECRET: ${JWT_SECRET}
                  MINDLOGIC_API_KEY: ${MINDLOGIC_API_KEY}
                  GCP_PROJECT_ID: ${GCP_PROJECT_ID}
                  GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}
                  SERVER_DOMAIN: ${SERVER_DOMAIN}
                  FRONTEND_URL: ${FRONTEND_URL}
                depends_on:
                  mysql:
                    condition: service_healthy

            volumes:
              mysql_data:
            COMPOSEEOF

            cat > ~/keepy/.env << 'ENVEOF'
            MYSQL_USERNAME=${{ secrets.MYSQL_USERNAME }}
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            APPLE_CLIENT_ID=${{ secrets.APPLE_CLIENT_ID }}
            APPLE_CLIENT_SECRET=${{ secrets.APPLE_CLIENT_SECRET }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            MINDLOGIC_API_KEY=${{ secrets.MINDLOGIC_API_KEY }}
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
            GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}
            SERVER_DOMAIN=${{ secrets.SERVER_DOMAIN }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            ENVEOF

            echo '${{ secrets.GCP_SA_KEY }}' | docker login -u _json_key --password-stdin asia-northeast3-docker.pkg.dev

            cp ~/keepy/.env .
            docker compose -f ~/keepy/docker-compose.yml pull app
            docker compose -f ~/keepy/docker-compose.yml up -d --force-recreate app
            docker image prune -af
